<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>音楽アメーバ</title>
  <script src="lib/p5.min.js"></script>
  <script src="lib/p5.sound.min.js"></script>
  <script src="lib/matter.min.js"></script>
  <script src="skecth260718.js"></script>
  <style>
    body{
      margin:0;
      overflow:hidden;
      background:#111;
    }
    canvas{
        display:block;
        position:fixed;
        z-index:0;
    }
    /*=====================
      音楽選択UI
    =====================*/

    #musicUI{

        position:absolute;

        left:50%;
        top:50%;

        transform:translate(-50%,-50%);

        z-index:99999;

        display:flex;

        flex-direction:column;

        align-items:center;

        gap:15px;

    }

    /* ラベル */

    #musicUI label{

        color:white;

        font-size:24px;

        font-family:sans-serif;

        letter-spacing:3px;

        text-shadow:0 0 15px rgba(255,255,255,.8);

    }

    /* セレクトボックス */

    #musicSelect{

        width:min(70vw,380px);

        height:55px;

        font-size:clamp(16px,2vw,22px);

        border-radius:999px;

        border:2px solid rgba(255,255,255,.5);

        background:rgba(255,255,255,.15);

        color:white;

        backdrop-filter:blur(10px);

        -webkit-backdrop-filter:blur(10px);

        padding:0 20px;

        outline:none;

        text-align: center;

        transition:.3s;
    }

    #musicSelect option{
      background: #111;
      color:#fff;
      text-align: center;
    }

    #musicSelect:hover{

        background:rgba(255,255,255,.25);

        transform:scale(1.03);
    }

    #musicSelect:focus{

        border-color:#7efcff;

        box-shadow:0 0 20px rgba(126,252,255,.6);
    }

    @media (max-width:768px){

        #musicSelect{

            width:220px;

            height:50px;

            font-size:16px;

        }

        #musicUI label{

            font-size:20px;

        }

    }
  </style>
</head>
<body>
  <div id="musicUI">
    <label for="musicSelect">
      ♪MUSIC
    </label>
    <select id="musicSelect">
      <option value="">音楽を選択</option>
      <option value="/bgm/158_BPM116.mp3">音楽1</option>
      <option value="/bgm/158_BPM116.mp3">音楽2</option>
      <option value="/bgm/291_BPM106.mp3">音楽3</option>
      <option value="/bgm/375_BPM110.mp3">音楽4</option>
    </select>
  </div>
</body>
</html>
